{% capture content %}
  <a href="/">Max Heinritz</a> > <a href="/projects">Projects</a>
  <h1>{{ page.title }}</h1>
  <div class="cols">
    <div class="desc">
      <h4>{{ page.year }}</h4>
      <p>{{ page.desc }}</p>
      {% if page.link %}
      <p><a class="project-link" href="{{ page.link }}">Link</a></p>
      {% endif %}
    </div>
    <div>
      {% for image in page.images %}
        <img src="/images/{{image}}"></img>
      {% endfor %}
    </div>
  </div>
{% endcapture %}


{% include detail.html class="detail project" %}
